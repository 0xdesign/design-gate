<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design-gate run</title>
<!--__REFRESH__-->
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1a1a18; --ink-2: #5c5b57; --ink-3: #8d8b85; --line: #e3e1db;
    --approve: #1f7a4d; --approve-bg: #e4f3ea; --revise: #a35a00; --revise-bg: #fbeedb; --stop: #8a2f2f; --stop-bg: #f8e3e3;
    --escalate: #5b3fa3; --escalate-bg: #ebe5f8; --skip: #5c5b57; --skip-bg: #ecebe7; --accent: #1f4fd8;
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Menlo, monospace; --sans: "Inter Variable", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #131312; --panel: #1c1c1a; --ink: #ecebe6; --ink-2: #b3b1aa; --ink-3: #7d7b75; --line: #2c2c29;
    --approve: #6fd39a; --approve-bg: #12301f; --revise: #f0b25c; --revise-bg: #332512; --stop: #f08a8a; --stop-bg: #361818;
    --escalate: #b9a4f2; --escalate-bg: #241c3a; --skip: #b3b1aa; --skip-bg: #262624; --accent: #7ea0ff;
  } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
  body { padding: 0 16px 48px; }
  a { color: var(--accent); }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 16px 0 12px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; }
  header.top h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header.top .meta { color: var(--ink-2); font-size: 13px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.01em; }
  .badge.APPROVED { color: var(--approve); background: var(--approve-bg); }
  .badge.REVISE, .badge.OBSERVATIONS_NEEDED { color: var(--revise); background: var(--revise-bg); }
  .badge.STOP { color: var(--stop); background: var(--stop-bg); }
  .badge.ESCALATE { color: var(--escalate); background: var(--escalate-bg); }
  .badge.SKIPPED, .badge.running { color: var(--skip); background: var(--skip-bg); }
  .banner { margin: 16px 0 0; padding: 10px 14px; border: 1px solid var(--line); border-left: 3px solid var(--revise); background: var(--panel); border-radius: 6px; font-size: 13px; }
  .banner code { font-family: var(--mono); font-size: 12px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 16px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .stat .label { color: var(--ink-3); font-size: 12px; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .trend { height: 44px; margin-top: 6px; }
  .trend svg { width: 100%; height: 100%; overflow: visible; }
  section h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); text-transform: none; margin: 28px 0 10px; }
  .film { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(320px, 1fr); gap: 14px; overflow-x: auto; padding: 4px 0 12px; scroll-snap-type: x proximity; }
  .film[data-turns="1"] { grid-auto-columns: minmax(320px, 720px); }
  .film[data-turns="2"] { grid-auto-columns: minmax(320px, 1fr); }
  .film[data-many] { grid-auto-columns: minmax(320px, 400px); }
  .shots.single { grid-template-columns: 1fr 120px; }
  .shot.mobile.wide { width: 120px; }
  .turn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 10px; }
  .turn.final { border-color: var(--approve); box-shadow: 0 0 0 3px var(--approve-bg); }
  .turn .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .turn .head .n { font-weight: 600; }
  .turn .head time { color: var(--ink-3); font-size: 12px; }
  .shots { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start; }
  .shot { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; }
  .shot img { display: block; width: 100%; height: auto; }
  .shot.mobile { width: 88px; }
  .shot .cap { font-size: 11px; color: var(--ink-3); padding: 3px 6px; border-top: 1px solid var(--line); background: var(--panel); }
  .score { display: flex; align-items: baseline; gap: 8px; }
  .score .big { font-size: 20px; font-weight: 600; }
  .score .delta { font-size: 12px; }
  .delta.up { color: var(--approve); } .delta.down { color: var(--stop); } .delta.flat { color: var(--ink-3); }
  .cats { display: grid; grid-template-columns: 52px 1fr 34px; gap: 4px 8px; align-items: center; font-size: 12px; }
  .cats .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .cats .bar i { display: block; height: 100%; background: var(--accent); }
  .cats .bar i.low { background: var(--revise); }
  .fixes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .fixes li { font-size: 12.5px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); }
  .fixes li.resolved { border-color: var(--approve); background: var(--approve-bg); }
  .fixes li.persisted { border-color: var(--revise); background: var(--revise-bg); }
  .fixes li .id { font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
  .fixes li .sel { font-family: var(--mono); font-size: 11px; color: var(--ink-3); word-break: break-all; }
  .files { font-family: var(--mono); font-size: 11px; color: var(--ink-2); white-space: pre-wrap; }
  details.why { border-top: 1px solid var(--line); padding-top: 8px; }
  details.why summary { cursor: pointer; font-size: 12px; color: var(--ink-2); }
  table.q { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 11.5px; margin-top: 6px; }
  table.q td { padding: 3px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  table.q td.id { font-family: var(--mono); width: 46%; overflow-wrap: anywhere; }
  table.q td.num { white-space: nowrap; width: 70px; }
  .pbar { position: relative; height: 8px; background: var(--line); border-radius: 4px; min-width: 70px; }
  .pbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 4px; }
  .pbar i.fail { background: var(--revise); }
  .pbar b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .6; }
  .tag { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--line); color: var(--ink-2); margin-left: 4px; }
  .tag.gate { border-color: var(--stop); color: var(--stop); }
  .tag.hidden { border-style: dashed; }
  .tag.det { border-color: var(--escalate); color: var(--escalate); }
  .compare { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .compare .frame { position: relative; overflow: hidden; border-radius: 6px; border: 1px solid var(--line); max-width: 900px; }
  .compare img { display: block; width: 100%; height: auto; }
  .compare .before { position: absolute; inset: 0; width: 50%; overflow: hidden; border-right: 2px solid var(--accent); }
  .compare .before img { max-width: none; }
  .compare input[type=range] { width: 100%; margin-top: 8px; }
  .compare .labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-3); }
  .obs { font-size: 11.5px; color: var(--ink-2); display: grid; grid-template-columns: max-content 1fr; gap: 2px 8px; }
  .obs dt { font-family: var(--mono); color: var(--ink-3); }
  .obs dd { margin: 0; overflow-wrap: anywhere; }
  .muted { color: var(--ink-3); }
  .empty { color: var(--ink-3); font-style: italic; }
  @media (max-width: 720px) { .film { grid-auto-columns: minmax(260px, 86vw); } }
</style>
</head>
<body>
<header class="top">
  <h1>design-gate</h1>
  <span id="status" class="badge running">running</span>
  <span class="meta" id="meta"></span>
</header>
<div id="banner"></div>
<div class="summary" id="summary"></div>
<section><h2>Iterations</h2><div class="film" id="film"></div></section>
<section id="compareSection"><h2>Before and after</h2><div class="compare" id="compare"></div></section>
<script id="run-data" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  const raw = document.getElementById("run-data").textContent.trim();
  const data = raw.startsWith("{") ? JSON.parse(raw) : { run: null, turns: [] };
  const run = data.run, turns = data.turns || [];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pct = (x) => Math.round((x || 0) * 100);
  const rel = (p) => (p || "").replace(/^.*\/runs\/[^/]+\//, "");
  const CATS = ["brand", "craft", "ux", "a11y", "pattern", "copy"];

  if (!run) { $("#status").textContent = "no data"; return; }
  const verdictOf = (t) => t.decision ? t.decision.verdict : t.verdict;
  const last = turns[turns.length - 1];
  const statusLabel = run.status === "running" ? (last ? verdictOf(last) : "running") : run.status.toUpperCase();
  const statusEl = $("#status"); statusEl.textContent = statusLabel.replace("_", " ").toLowerCase(); statusEl.className = "badge " + (run.status === "running" && last ? verdictOf(last) : run.status === "approved" ? "APPROVED" : run.status === "escalated" ? "ESCALATE" : run.status === "stopped" ? "STOP" : "running");
  $("#meta").textContent = `run ${run.runId} · started ${new Date(run.startedAt).toLocaleString()}${run.task ? " · " + run.task : ""}`;

  const judged = turns.some((t) => (t.screens || []).some((s) => s.judge && s.judge.results && s.judge.results.length));
  if (!run.keyPresent && !judged) $("#banner").innerHTML = `<div class="banner"><strong>Facts-only mode.</strong> No TypeSafe key was found, so judged questions were skipped. Run <code>design-gate login</code> in your terminal to enable the full gate.</div>`;

  // Summary stats + trend
  const best = Math.max(0, ...turns.map((t) => t.decision ? t.decision.overall : t.overall || 0));
  const cost = turns.reduce((a, t) => a + (t.usage ? t.usage.costUsd : t.costUsd || 0), 0);
  const points = turns.map((t, i) => [i, t.decision ? t.decision.overall : t.overall || 0]);
  const w = 200, h = 40;
  const path = points.map(([i, v], k) => `${k ? "L" : "M"}${(i / Math.max(1, turns.length - 1)) * w},${h - v * h}`).join(" ");
  $("#summary").innerHTML = `
    <div class="stat"><div class="label">Verdict</div><div class="value">${esc(last ? verdictOf(last).replace("_", " ") : "—")}</div></div>
    <div class="stat"><div class="label">Score</div><div class="value num">${last ? pct(last.decision ? last.decision.overall : last.overall) : "—"}<span class="muted" style="font-size:13px"> / best ${pct(best)}</span></div>
      <div class="trend"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg></div></div>
    <div class="stat"><div class="label">Iterations</div><div class="value num">${turns.length}</div></div>
    <div class="stat"><div class="label">Judge cost</div><div class="value num">$${cost.toFixed(4)}</div></div>`;

  // Filmstrip
  const film = $("#film"); film.dataset.turns = String(turns.length); if (turns.length > 3) film.dataset.many = "1";
  if (!turns.length) film.innerHTML = `<div class="empty">No iterations yet.</div>`;
  turns.forEach((t, i) => {
    const d = t.decision || {}; const v = verdictOf(t); const prev = turns[i - 1];
    const overall = d.overall ?? t.overall ?? 0; const prevOverall = prev ? (prev.decision ? prev.decision.overall : prev.overall) : null;
    const delta = prevOverall === null ? null : overall - prevOverall;
    const shots = (t.screens || t.screenshots || []).map((s) => ({ key: s.key, path: s.screenshotPath || s.path, viewport: s.viewport || (s.key || "").split("|")[1] }));
    const desktop = shots.find((s) => s.viewport === "desktop") || shots[0]; const mobile = shots.find((s) => s.viewport === "mobile");
    const sentPrev = new Set(prev ? (prev.decision ? prev.decision.fixes.map((f) => f.id) : prev.fixesSent || []) : []);
    const fixes = (d.fixes || []).map((f) => f.id);
    const resolved = [...sentPrev].filter((id) => !fixes.includes(id));
    const fixesHtml = (d.fixes || []).map((f) => `<li class="${sentPrev.has(f.id) ? "persisted" : ""}"><span class="id">${esc(f.id)}</span>${f.source === "deterministic" ? '<span class="tag det">measured</span>' : ""}<br>${esc(f.text)}${f.selectors && f.selectors.length ? `<br><span class="sel">${esc(f.selectors.join(", "))}</span>` : ""}</li>`).join("")
      + resolved.map((id) => `<li class="resolved"><span class="id">${esc(id)}</span> resolved</li>`).join("");
    const cats = CATS.map((c) => { const val = d.categories ? d.categories[c] : (t.categories || {})[c]; return `<span>${c}</span><div class="bar"><i class="${(val || 0) < 0.6 ? "low" : ""}" style="width:${pct(val)}%"></i></div><span class="num" style="text-align:right">${val == null ? "–" : pct(val)}</span>`; }).join("");
    const files = (t.filesChanged || []).length ? `<div class="files">${esc(t.filesChanged.slice(0, 12).join("\n"))}${t.filesChanged.length > 12 ? `\n… +${t.filesChanged.length - 12}` : ""}</div>` : `<div class="muted" style="font-size:12px">no file changes recorded</div>`;
    // Why panel
    const rows = [], passing = [];
    for (const hf of t.hardFailures || []) rows.push(`<tr><td class="id">${esc(hf.id)}<span class="tag det">measured</span></td><td colspan="2">${esc(hf.measured)}<br><span class="sel muted">${esc((hf.selectors || []).join(", "))}</span></td></tr>`);
    const qrow = (s, q) => { const p = q.probability; const thr = q.threshold; const fail = !q.passed; return `<tr><td class="id">${esc(q.id)}${q.gate ? '<span class="tag gate">gate</span>' : ""}${q.hidden ? '<span class="tag hidden">hidden</span>' : ""}<br><span class="muted">${esc(s.key)}</span></td><td><div class="pbar"><i class="${fail ? "fail" : ""}" style="width:${pct(p)}%"></i><b style="left:${pct(thr)}%"></b></div></td><td class="num">${pct(p)}<span class="muted"> · c${Math.round((q.confidence || 0) * 100)}</span></td></tr>`; };
    for (const s of t.screens || []) for (const q of (s.judge && s.judge.results) || []) (!q.passed ? rows : passing).push(qrow(s, q));
    let checkCount = rows.length + passing.length;
    if (passing.length) rows.push(`<tr><td colspan="3" style="padding:6px 4px 0"><details><summary class="muted" style="cursor:pointer;font-size:11.5px">${passing.length} passing checks</summary><table class="q">${passing.join("")}</table></details></td></tr>`);
    const obs = (t.screens || []).filter((s) => s.observations).map((s) => `<div class="muted" style="margin-top:6px">${esc(s.key)} — observations (${esc(t.observationsAuthor || "agent")})</div><dl class="obs">${Object.entries(s.observations).filter(([k]) => k !== "notes").map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(Array.isArray(val) ? (val.length ? val.join(", ") : "—") : (val && typeof val === "object") ? Object.entries(val).map(([k, v]) => k + ": " + (v || "—")).join(" · ") : (val === "" ? "—" : val))}</dd>`).join("")}</dl>`).join("");
    const isFinal = v === "APPROVED";
    film.insertAdjacentHTML("beforeend", `
      <article class="turn ${isFinal ? "final" : ""}">
        <div class="head"><span class="n">Turn ${t.turn ?? i + 1}</span><span class="badge ${esc(v)}">${esc(v.replace("_", " ").toLowerCase())}</span><time>${new Date(t.at).toLocaleTimeString()}</time></div>
        <div class="shots ${turns.length <= 2 ? "single" : ""}">${desktop ? `<div class="shot"><img src="${esc(rel(desktop.path))}" alt="desktop screenshot turn ${i + 1}"><div class="cap">${esc(desktop.key)}</div></div>` : ""}${mobile ? `<div class="shot mobile ${turns.length <= 2 ? "wide" : ""}"><img src="${esc(rel(mobile.path))}" alt="mobile screenshot turn ${i + 1}"><div class="cap">mobile</div></div>` : ""}</div>
        <div class="score"><span class="big num">${pct(overall)}</span>${delta === null ? "" : `<span class="delta num ${delta > 0.005 ? "up" : delta < -0.005 ? "down" : "flat"}">${delta > 0 ? "+" : ""}${Math.round(delta * 100)}</span>`}${d.reason ? `<span class="muted" style="font-size:12px">${esc(d.reason)}</span>` : ""}</div>
        <div class="cats">${cats}</div>
        ${fixesHtml ? `<ul class="fixes">${fixesHtml}</ul>` : `<div class="muted" style="font-size:12px">no fixes sent</div>`}
        ${files}
        <details class="why"><summary>Why · ${checkCount} checks, ${rows.length - (passing.length ? 1 : 0)} failing</summary><table class="q">${rows.join("")}</table>${obs}</details>
      </article>`);
  });

  // Before / after
  const firstShot = turns[0] && (turns[0].screens || [])[0]; const lastShot = last && (last.screens || []).find((s) => firstShot && s.key === firstShot.key);
  if (turns.length > 1 && firstShot && lastShot) {
    $("#compare").innerHTML = `<div class="frame" id="frame"><img src="${esc(rel(lastShot.screenshotPath))}" alt="latest iteration"><div class="before" id="before"><img src="${esc(rel(firstShot.screenshotPath))}" alt="first iteration"></div></div><input type="range" min="0" max="100" value="50" id="slider" aria-label="compare before and after"><div class="labels"><span>turn 1 (drag to compare)</span><span>turn ${last.turn ?? turns.length}</span></div>`;
    const before = $("#before"), frame = $("#frame"); const fit = () => { before.querySelector("img").style.width = frame.clientWidth + "px"; };
    fit(); window.addEventListener("resize", fit); frame.querySelector("img").addEventListener("load", fit);
    $("#slider").addEventListener("input", (e) => { before.style.width = e.target.value + "%"; });
  } else { $("#compareSection").style.display = "none"; }
})();
</script>
</body>
</html>
