<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design-gate run</title>
<!--__REFRESH__-->
<style>
  :root { --bg: #fafaf8; --ink: #111; --ink-2: #6b6b66; --ink-3: #a3a39d; --line: #e6e5e0; --fail: #b4531c; --ok: #2f6b45; --accent: #111;
    --mono: "SF Mono", ui-monospace, Menlo, monospace; --sans: -apple-system, "Helvetica Neue", Inter, system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141414; --ink: #ededea; --ink-2: #9c9c96; --ink-3: #5f5f5a; --line: #2a2a28; --fail: #e0895a; --ok: #7cc397; --accent: #ededea; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  body { padding: 0 max(24px, 6vw) 96px; max-width: 1360px; margin: 0 auto; }
  a { color: inherit; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 13px; }
  header.top { display: flex; flex-wrap: wrap; gap: 8px 32px; align-items: baseline; padding: 40px 0 24px; border-bottom: 1px solid var(--line); }
  header.top h1 { font-size: 15px; font-weight: 500; margin: 0; letter-spacing: 0; }
  header.top .meta { color: var(--ink-3); font-size: 13px; margin-left: auto; }
  .badge { font-size: 13px; font-weight: 400; color: var(--ink-2); }
  .badge::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); margin: 0 8px 2px 0; }
  .badge.APPROVED::before { background: var(--ok); } .badge.REVISE::before, .badge.OBSERVATIONS_NEEDED::before, .badge.STOP::before, .badge.ESCALATE::before { background: var(--fail); }
  .banner { margin: 24px 0 0; padding: 0 0 0 14px; border-left: 1px solid var(--fail); color: var(--ink-2); font-size: 14px; }
  .banner code { font-family: var(--mono); font-size: 13px; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px 56px; padding: 32px 0 8px; }
  .stat .label { color: var(--ink-3); font-size: 12px; letter-spacing: .02em; }
  .stat .value { font-size: 28px; font-weight: 300; line-height: 1.2; letter-spacing: -.01em; }
  .stat .value .muted { font-size: 13px; }
  .trend { height: 28px; width: 120px; margin-top: 4px; }
  .trend svg { width: 100%; height: 100%; overflow: visible; color: var(--ink-2); }
  section h2 { font-size: 12px; font-weight: 400; color: var(--ink-3); letter-spacing: .02em; margin: 56px 0 16px; }
  .film { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(440px, 1fr); gap: 48px; overflow-x: auto; padding: 0 0 12px; scroll-snap-type: x proximity; }
  .film[data-turns="1"] { grid-auto-columns: minmax(320px, 760px); }
  .film[data-many] { grid-auto-columns: minmax(440px, 560px); }
  .turn { display: flex; flex-direction: column; gap: 16px; scroll-snap-align: start; padding-top: 16px; border-top: 1px solid var(--line); }
  .turn.final { border-top-color: var(--ink); }
  .turn .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .turn .head .n { font-weight: 500; }
  .turn .head time { color: var(--ink-3); font-size: 12px; }
  .shots { display: grid; grid-template-columns: 1fr 120px; gap: 12px; align-items: start; }
  .shots.single { grid-template-columns: 1fr 140px; }
  .shot { overflow: hidden; background: #fff; border: 1px solid var(--line); }
  .shot img { display: block; width: 100%; height: auto; }
  .shot.mobile { width: 120px; } .shot.mobile.wide { width: 140px; }
  .shot .cap { font-size: 11px; color: var(--ink-3); padding: 4px 0 0; border: 0; background: none; }
  .score { display: flex; align-items: baseline; gap: 10px; }
  .score .big { font-size: 28px; font-weight: 300; }
  .score .delta { font-size: 12px; }
  .delta.up { color: var(--ok); } .delta.down { color: var(--fail); } .delta.flat { color: var(--ink-3); }
  .cats { display: grid; grid-template-columns: 56px 1fr 0; gap: 6px 12px; align-items: center; font-size: 12px; color: var(--ink-2); }
  .cats .bar { height: 1px; background: var(--line); position: relative; }
  .cats .bar i { display: block; height: 100%; background: var(--ink); }
  .cats .bar i.low { background: var(--fail); }
  .fixes { list-style: none; margin: 0; padding: 0; }
  .fixes li { font-size: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
  .fixes li.resolved { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }
  .fixes li.persisted .id::after { content: " · still open"; color: var(--fail); font-family: var(--sans); }
  .fixes li .id { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
  .fixes li .sel { font-family: var(--mono); font-size: 11px; color: var(--ink-3); word-break: break-all; }
  .files { font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: pre-wrap; }
  details.why { border-top: 1px solid var(--line); padding-top: 10px; }
  details.why summary { cursor: pointer; font-size: 12px; color: var(--ink-3); list-style: none; }
  details.why summary::-webkit-details-marker { display: none; }
  details.why summary::after { content: " ↓"; } details.why[open] summary::after { content: " ↑"; }
  table.q { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  table.q td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; color: var(--ink-2); }
  table.q td.id { font-family: var(--mono); width: 46%; overflow-wrap: anywhere; color: var(--ink); }
  table.q td.num { white-space: nowrap; width: 76px; text-align: right; }
  .pbar { position: relative; height: 1px; background: var(--line); min-width: 60px; margin-top: 9px; }
  .pbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
  .pbar i.fail { background: var(--fail); }
  .pbar b { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--ink-3); }
  .tag { font-size: 10px; color: var(--ink-3); margin-left: 6px; letter-spacing: .04em; }
  .tag.gate { color: var(--fail); } .tag.det { color: var(--ink-2); }
  .compare .frame { position: relative; overflow: hidden; border: 1px solid var(--line); max-width: 900px; }
  .compare img { display: block; width: 100%; height: auto; }
  .compare .before { position: absolute; inset: 0; width: 50%; overflow: hidden; border-right: 1px solid var(--ink); }
  .compare .before img { max-width: none; }
  .compare input[type=range] { width: 100%; max-width: 900px; margin-top: 12px; accent-color: var(--ink); }
  .compare .labels { display: flex; justify-content: space-between; max-width: 900px; font-size: 12px; color: var(--ink-3); }
  .obs { font-size: 12px; color: var(--ink-2); display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; margin-top: 8px; }
  .obs dt { font-family: var(--mono); color: var(--ink-3); } .obs dd { margin: 0; overflow-wrap: anywhere; }
  .muted { color: var(--ink-3); } .empty { color: var(--ink-3); }
  @media (max-width: 720px) { .film { grid-auto-columns: minmax(260px, 88vw); gap: 24px; } .summary { gap: 8px 32px; } }
</style>
</head>
<body>
<header class="top">
  <h1>design-gate</h1>
  <span id="status" class="badge running">running</span>
  <span class="meta" id="meta"></span>
</header>
<div id="banner"></div>
<div class="summary" id="summary"></div>
<section id="compareSection"><h2>Before and after</h2><div class="compare" id="compare"></div></section>
<section><h2>Iterations</h2><div class="film" id="film"></div></section>
<script id="run-data" type="application/json">/*__DATA__*/</script>
<script>
(function () {
  const raw = document.getElementById("run-data").textContent.trim();
  const data = raw.startsWith("{") ? JSON.parse(raw) : { run: null, turns: [] };
  const run = data.run, turns = data.turns || [];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pct = (x) => Math.round((x || 0) * 100);
  const rel = (p) => (p || "").replace(/^.*\/runs\/[^/]+\//, "");
  const CATS = ["brand", "craft", "ux", "a11y", "pattern", "copy"];

  if (!run) { $("#status").textContent = "no data"; return; }
  const verdictOf = (t) => t.decision ? t.decision.verdict : t.verdict;
  const last = turns[turns.length - 1];
  const statusLabel = run.status === "running" ? (last ? verdictOf(last) : "running") : run.status.toUpperCase();
  const statusEl = $("#status"); statusEl.textContent = statusLabel.replace("_", " ").toLowerCase(); statusEl.className = "badge " + (run.status === "running" && last ? verdictOf(last) : run.status === "approved" ? "APPROVED" : run.status === "escalated" ? "ESCALATE" : run.status === "stopped" ? "STOP" : "running");
  $("#meta").textContent = `run ${run.runId} · started ${new Date(run.startedAt).toLocaleString()}${run.task ? " · " + run.task : ""}`;

  const judged = turns.some((t) => (t.screens || []).some((s) => s.judge && s.judge.results && s.judge.results.length));
  if (!run.keyPresent && !judged) $("#banner").innerHTML = `<div class="banner"><strong>Facts-only mode.</strong> No TypeSafe key was found, so judged questions were skipped. Run <code>design-gate login</code> in your terminal to enable the full gate.</div>`;

  // Summary stats + trend
  const best = Math.max(0, ...turns.map((t) => t.decision ? t.decision.overall : t.overall || 0));
  const cost = turns.reduce((a, t) => a + (t.usage ? t.usage.costUsd : t.costUsd || 0), 0);
  const points = turns.map((t, i) => [i, t.decision ? t.decision.overall : t.overall || 0]);
  const w = 200, h = 40;
  const path = points.map(([i, v], k) => `${k ? "L" : "M"}${(i / Math.max(1, turns.length - 1)) * w},${h - v * h}`).join(" ");
  $("#summary").innerHTML = `
    <div class="stat"><div class="label">Verdict</div><div class="value">${esc(last ? verdictOf(last).replace("_", " ") : "—")}</div></div>
    <div class="stat"><div class="label">Score</div><div class="value num">${last ? pct(last.decision ? last.decision.overall : last.overall) : "—"}<span class="muted" style="font-size:13px"> / best ${pct(best)}</span></div>
      <div class="trend"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${path}" fill="none" stroke="currentColor" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg></div></div>
    <div class="stat"><div class="label">&nbsp;</div><div class="muted" style="font-size:12px;margin-top:10px">${turns.length} turns · ${cost.toFixed(4)}</div></div>`;

  // Filmstrip
  const film = $("#film"); film.dataset.turns = String(turns.length); if (turns.length > 3) film.dataset.many = "1";
  if (!turns.length) film.innerHTML = `<div class="empty">No iterations yet.</div>`;
  turns.forEach((t, i) => {
    const d = t.decision || {}; const v = verdictOf(t); const prev = turns[i - 1];
    const overall = d.overall ?? t.overall ?? 0; const prevOverall = prev ? (prev.decision ? prev.decision.overall : prev.overall) : null;
    const delta = prevOverall === null ? null : overall - prevOverall;
    const shots = (t.screens || t.screenshots || []).map((s) => ({ key: s.key, path: s.screenshotPath || s.path, viewport: s.viewport || (s.key || "").split("|")[1] }));
    const desktop = shots.find((s) => s.viewport === "desktop") || shots[0]; const mobile = shots.find((s) => s.viewport === "mobile");
    const sentPrev = new Set(prev ? (prev.decision ? prev.decision.fixes.map((f) => f.id) : prev.fixesSent || []) : []);
    const fixes = (d.fixes || []).map((f) => f.id);
    const resolved = [...sentPrev].filter((id) => !fixes.includes(id));
    const fixesHtml = (d.fixes || []).map((f) => `<li class="${sentPrev.has(f.id) ? "persisted" : ""}"><span class="id">${esc(f.id)}</span>${f.source === "deterministic" ? '<span class="tag det">measured</span>' : ""}<br>${esc(f.text)}${f.selectors && f.selectors.length ? `<br><span class="sel">${esc(f.selectors.join(", "))}</span>` : ""}</li>`).join("")
      + resolved.map((id) => `<li class="resolved"><span class="id">${esc(id)}</span> resolved</li>`).join("");
    const cats = CATS.map((c) => { const val = d.categories ? d.categories[c] : (t.categories || {})[c]; return `<span>${c}</span><div class="bar"><i class="${(val || 0) < 0.6 ? "low" : ""}" style="width:${pct(val)}%"></i></div><span></span>`; }).join("");
    const files = (t.filesChanged || []).length ? `<div class="files">${esc(t.filesChanged.slice(0, 12).join("\n"))}${t.filesChanged.length > 12 ? `\n… +${t.filesChanged.length - 12}` : ""}</div>` : `<div class="muted" style="font-size:12px">no file changes recorded</div>`;
    // Why panel
    const rows = [], passing = [];
    for (const hf of t.hardFailures || []) rows.push(`<tr><td class="id">${esc(hf.id)}<span class="tag det">measured</span></td><td colspan="2">${esc(hf.measured)}<br><span class="sel muted">${esc((hf.selectors || []).join(", "))}</span></td></tr>`);
    const qrow = (s, q) => { const p = q.probability; const thr = q.threshold; const fail = !q.passed; return `<tr><td class="id">${esc(q.id)}${q.gate ? '<span class="tag gate">gate</span>' : ""}${q.hidden ? '<span class="tag hidden">hidden</span>' : ""}<br><span class="muted">${esc(s.key)}</span></td><td><div class="pbar"><i class="${fail ? "fail" : ""}" style="width:${pct(p)}%"></i><b style="left:${pct(thr)}%"></b></div></td><td class="num">${pct(p)}<span class="muted"> · c${Math.round((q.confidence || 0) * 100)}</span></td></tr>`; };
    for (const s of t.screens || []) for (const q of (s.judge && s.judge.results) || []) (!q.passed ? rows : passing).push(qrow(s, q));
    let checkCount = rows.length + passing.length;
    if (passing.length) rows.push(`<tr><td colspan="3" style="padding:6px 4px 0"><details><summary class="muted" style="cursor:pointer;font-size:11.5px">${passing.length} passing checks</summary><table class="q">${passing.join("")}</table></details></td></tr>`);
    const obs = (t.screens || []).filter((s) => s.observations).map((s) => `<div class="muted" style="margin-top:6px">${esc(s.key)} — observations (${esc(t.observationsAuthor || "agent")})</div><dl class="obs">${Object.entries(s.observations).filter(([k]) => k !== "notes").map(([k, val]) => `<dt>${esc(k)}</dt><dd>${esc(Array.isArray(val) ? (val.length ? val.join(", ") : "—") : (val && typeof val === "object") ? Object.entries(val).map(([k, v]) => k + ": " + (v || "—")).join(" · ") : (val === "" ? "—" : val))}</dd>`).join("")}</dl>`).join("");
    const isFinal = v === "APPROVED";
    film.insertAdjacentHTML("beforeend", `
      <article class="turn ${isFinal ? "final" : ""}">
        <div class="head"><span class="n">Turn ${t.turn ?? i + 1}</span><span class="badge ${esc(v)}">${esc(v.replace("_", " ").toLowerCase())}</span><time>${new Date(t.at).toLocaleTimeString()}</time></div>
        <div class="shots ${turns.length <= 2 ? "single" : ""}">${desktop ? `<div class="shot"><img src="${esc(rel(desktop.path))}" alt="desktop screenshot turn ${i + 1}"><div class="cap">${esc(desktop.key)}</div></div>` : ""}${mobile ? `<div class="shot mobile ${turns.length <= 2 ? "wide" : ""}"><img src="${esc(rel(mobile.path))}" alt="mobile screenshot turn ${i + 1}"><div class="cap">mobile</div></div>` : ""}</div>
        <div class="score"><span class="big num">${pct(overall)}</span>${delta === null ? "" : `<span class="delta num ${delta > 0.005 ? "up" : delta < -0.005 ? "down" : "flat"}">${delta > 0 ? "+" : ""}${Math.round(delta * 100)}</span>`}${d.reason ? `<span class="muted" style="font-size:12px">${esc(d.reason)}</span>` : ""}</div>
        <div class="cats">${cats}</div>
        ${fixesHtml ? `<details class="why"><summary>${(d.fixes || []).length} fixes${resolved.length ? ` · ${resolved.length} resolved` : ""}</summary><ul class="fixes">${fixesHtml}</ul>${files}</details>` : `<div class="muted" style="font-size:12px">no fixes</div>`}
        <details class="why"><summary>Why · ${checkCount} checks, ${rows.length - (passing.length ? 1 : 0)} failing</summary><table class="q">${rows.join("")}</table>${obs}</details>
      </article>`);
  });

  // Before / after
  const firstShot = turns[0] && (turns[0].screens || [])[0]; const lastShot = last && (last.screens || []).find((s) => firstShot && s.key === firstShot.key);
  if (turns.length > 1 && firstShot && lastShot) {
    $("#compare").innerHTML = `<div class="frame" id="frame"><img src="${esc(rel(lastShot.screenshotPath))}" alt="latest iteration"><div class="before" id="before"><img src="${esc(rel(firstShot.screenshotPath))}" alt="first iteration"></div></div><input type="range" min="0" max="100" value="50" id="slider" aria-label="compare before and after"><div class="labels"><span>turn 1 (drag to compare)</span><span>turn ${last.turn ?? turns.length}</span></div>`;
    const before = $("#before"), frame = $("#frame"); const fit = () => { before.querySelector("img").style.width = frame.clientWidth + "px"; };
    fit(); window.addEventListener("resize", fit); frame.querySelector("img").addEventListener("load", fit);
    $("#slider").addEventListener("input", (e) => { before.style.width = e.target.value + "%"; });
  } else { $("#compareSection").style.display = "none"; }
})();
</script>
</body>
</html>
